services:
  - type: web
    name: hr-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_API_KEY
        sync: false   # Render 대시보드에서 직접 입력 (DeepSeek 키)
      - key: APP_PASSWORD
        sync: false   # Render 대시보드에서 직접 입력 (직원 공유용 접속 비밀번호)
      - key: PYTHON_VERSION
        value: "3.12"
